name: publish-image
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image tag comes from package.json, not from the git ref, so the
      # published tag and the version the driver reports on /health cannot drift
      # apart. A workflow_dispatch from a branch therefore publishes the same
      # tag a v-tag push would.
      - name: derive image tag from package.json
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "package.json version is not x.y.z: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing moltrust/driver-did-moltrust:$version"

      # Tests before push. The image published on 2026-07-30 went out without
      # them, and the test file of the time used console.assert, which cannot
      # fail a run.
      - name: install and test
        run: |
          npm ci || npm install
          npm test

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          tags: |
            moltrust/driver-did-moltrust:${{ steps.meta.outputs.version }}
            moltrust/driver-did-moltrust:latest

      # The digest is what a consumer pins, so it belongs in the run summary
      # rather than only in the build log.
      - name: report tag and digest
        run: |
          {
            echo "### Published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`moltrust/driver-did-moltrust:${{ steps.meta.outputs.version }}\` |"
            echo "| also | \`moltrust/driver-did-moltrust:latest\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
